<html lang="ru">
<head>

    <title>Мой чистый проект</title>
    <!-- Подключаем наш внешний файл стилей CSS -->

</head>
<body>
<div class="card">
    <!-- Изначально заголовок приветствует Гостя -->
    <div class="card">
    <!-- Обернули заголовок и кнопку выхода в один контейнер -->
    <div class="header-container">
        <h1 id="welcome-text">Привет, Гость! ☀️</h1>
        <button id="logout-btn" title="Выйти">❌</button>
    </div>
    
    <p>Нажмите на кнопку ниже, чтобы переключить режим оформления.</p>
    
    <button id="theme-toggle">Включить тёмную тему</button>

    <div class="form-container">
        <input type="text" id="name-input" placeholder="Введите ваше имя" autocomplete="off">
        <button id="save-name-btn">Сохранить имя</button>
    </div>
</div>


<script src="script.js"></script>

</div>
